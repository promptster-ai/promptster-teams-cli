name: secret-scan

# A product whose entire pitch is on-device secret redaction should scan its
# OWN source for committed credentials. gitleaks scans full history on every
# push to main and weekly. On a pull request it scans full history only when
# the PR changes go.mod/go.sum, a workflow, a local action, or the gitleaks
# allowlist (.gitleaksignore / .gitleaks.toml); every other PR has only its own
# commits scanned, which takes seconds. A secret in a PR is therefore still
# caught before it reaches main (this repo is public), but most PRs skip the
# full-history pass.
#
# The gate is inline here, not in a script: a PR that edits it is a workflow
# change, so that PR always gets the full scan.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "42 5 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: full history or this PR's commits?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # HEAD is the test merge commit; HEAD^1 is main.
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::could not list this PR's changed files; scanning full history"
            echo "full=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(go\.mod|go\.sum|\.github/workflows/.*|\.github/actions/.*|\.gitleaksignore|\.gitleaks\.toml)$' <<<"$changed"; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod, go.sum, workflow or gitleaks-config change: scanned this PR's commits only; the push to main scans full history." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Run the gitleaks binary directly rather than gitleaks-action: the
      # action requires a GITLEAKS_LICENSE key for org-owned repos,
      # the CLI (MIT) does not. Pinned by version + sha256, like the actions.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan
        # .gitleaksignore at the repo root is picked up automatically.
        env:
          FULL: ${{ steps.gate.outputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            gitleaks git --redact --verbose --exit-code 1 .
          else
            # The merge commit and every PR commit not already on main.
            gitleaks git --redact --verbose --exit-code 1 --log-opts="HEAD^1..HEAD" .
          fi
