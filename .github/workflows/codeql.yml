name: codeql

# Full scans run on every push to main and weekly. On a pull request the job
# still starts, because the automerge gate requires `CodeQL analyze (go)` to
# report, but it only analyzes when the PR changes go.mod/go.sum (the Go
# version and the packages autobuild compiles) or a workflow or local action
# (how this scan runs). Any other PR passes in seconds; its Go source is
# analyzed by the push to main after it merges, so alerts on new code surface
# there rather than on the PR.
#
# The gate is inline here, not in a script: a PR that edits it is a workflow
# change, so that PR is always scanned.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published CodeQL queries run against unchanged code too.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request HEAD is the test merge commit and HEAD^1 is main,
          # so depth 2 is enough to list what the PR changes.
          fetch-depth: 2
      - name: scan this PR?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::could not list this PR's changed files; scanning anyway"
            echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(go\.mod|go\.sum|\.github/workflows/.*|\.github/actions/.*|\.github/codeql/.*)$' <<<"$changed"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod, go.sum, workflow or CodeQL-config change: skipped here; the push to main scans it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.gate.outputs.scan == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: init CodeQL
        if: steps.gate.outputs.scan == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended
      - name: autobuild
        if: steps.gate.outputs.scan == 'true'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: analyze
        if: steps.gate.outputs.scan == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
